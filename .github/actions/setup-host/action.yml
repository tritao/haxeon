name: Set up host
description: Installs the build dependencies of the runner's OS, then the pinned tools (on Windows also the native runtime).
runs:
  using: composite
  steps:
    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      # The last line is what the UI package's native build needs (the app template test builds it); the x86-64 runner images
      # happen to have it, the arm64 ones do not.
      run: >-
        sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build curl unzip nodejs python3-msgpack ripgrep
        gdb autoconf automake libtool libpcre2-dev libuv1-dev
        libffi-dev libfontconfig1-dev libgl1-mesa-dev libgles2-mesa-dev libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

    - name: Install macOS build dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: brew install cmake ninja node ripgrep autoconf automake libtool

    - name: Set up Windows toolchain
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Bootstrap pinned tools
      if: runner.os != 'Windows'
      shell: bash
      run: ./scripts/bootstrap-tools.sh

    - name: Bootstrap pinned tools and native runtime
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./scripts/setup.ps1
