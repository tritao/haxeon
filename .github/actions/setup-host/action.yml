name: Set up host
description: Installs the build dependencies of the runner's OS, then the pinned tools (on Windows also the native runtime).
runs:
  using: composite
  steps:
    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      # The last line is what the app template test needs: the UI package's native build (the x86-64 runner images happen to
      # have it, the arm64 ones do not), an X server, and ImageMagick's import, with which the app captures its window on Linux.
      run: >-
        sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build curl unzip nodejs python3-msgpack ripgrep
        gdb autoconf automake libtool libpcre2-dev libuv1-dev
        libffi-dev libfontconfig1-dev libgl1-mesa-dev libgles2-mesa-dev libgtk-3-dev libwebkit2gtk-4.1-dev xvfb imagemagick

    - name: Install macOS build dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: brew install cmake ninja node ripgrep autoconf automake libtool

    # A program that cannot start (a missing DLL) or crashes fails with its status, instead of waiting on a loader or error
    # dialog nobody can close: HashLink's own SetErrorMode does not reach the programs the tests and the release smoke test
    # start through other programs.
    - name: No error dialogs
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Windows' -Name ErrorMode -Value 2 -Type DWord
        New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting' -Force | Out-Null
        Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting' -Name DontShowUI -Value 1 -Type DWord

    - name: Set up Windows toolchain
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Bootstrap pinned tools
      if: runner.os != 'Windows'
      shell: bash
      run: ./scripts/bootstrap-tools.sh

    - name: Bootstrap pinned tools and native runtime
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./scripts/setup.ps1
