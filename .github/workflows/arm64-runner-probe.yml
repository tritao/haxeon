# Temporary: the linux-arm64 job's runner shuts down (exit 143) once hld3 finishes, where differential-tests starts its
# cases, every one at once. This runs that suite in a memory-capped cgroup, so an out-of-memory kill stays inside it,
# and reports the peak, the cgroup's OOM events and the kernel's log. Remove once the job passes.
name: ARM64 runner probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      TEST_JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-host

      - name: Memory before
        run: free -m; nproc

      - name: differential-tests in a 10 GB cgroup
        run: |
          set +e
          sudo mkdir -p /sys/fs/cgroup/probe
          echo 10G | sudo tee /sys/fs/cgroup/probe/memory.max
          echo 0 | sudo tee /sys/fs/cgroup/probe/memory.swap.max
          (while sleep 5; do echo "mem: $(($(cat /sys/fs/cgroup/probe/memory.current) / 1048576)) MB, procs $(wc -l < /sys/fs/cgroup/probe/cgroup.procs)"; done) &
          monitor=$!
          bash -c 'echo $$ | sudo tee /sys/fs/cgroup/probe/cgroup.procs >/dev/null; exec scripts/test.sh --only differential-tests'
          echo "differential-tests exited with $?"
          kill $monitor
          echo "peak: $(($(cat /sys/fs/cgroup/probe/memory.peak) / 1048576)) MB"
          cat /sys/fs/cgroup/probe/memory.events
          sudo dmesg | grep -i -E "out of memory|oom|killed process" | tail -20
          exit 0
