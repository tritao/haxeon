name: experimental-apple-software-gc

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install build dependencies
        run: brew install cmake ninja node ripgrep autoconf automake libtool
      - name: Bootstrap pinned tools
        run: ./scripts/bootstrap-tools.sh
      - name: Build experimental shared-JIT collector
        run: |
          cmake --preset release -DHL_JIT_AARCH64_OLD=OFF -DHAXEON_GC_APPLE_SOFTWARE_TEST=ON
          cmake --build --preset release --target libhl hl haxeon_runtime
      - name: Validate software-only GC
        run: |
          set -o pipefail
          bash tests/integration/test-gc-apple-software.sh 2>&1 | tee out/gc-apple-software.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gc-apple-software-log
          path: out/gc-apple-software.log
