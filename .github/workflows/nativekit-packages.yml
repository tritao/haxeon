name: NativeKit packages
on:
  push:
  pull_request:
jobs:
  bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libffi-dev libfontconfig1-dev libgl1-mesa-dev libgles2-mesa-dev
          libgtk-3-dev libwebkit2gtk-4.1-dev ninja-build python3-fonttools xvfb
      - run: ./scripts/bootstrap-tools.sh
      - name: Check the package bindings no test script checks
        run: |
          ./packages/credentials/tools/update-haxeon-hxi.sh --check
          ./packages/filesystem/tools/update-haxeon-hxi.sh --check
          ./packages/animation/native/tools/update-haxeon-hxi.sh --check
          ./packages/audio/tools/update-haxeon-wasm-hxi.sh --check
          ./packages/ui/tools/update-haxeon-wasm-hxi.sh --check
          ./packages/gpu/tools/update-haxeon-hxi.sh --wasm --check
      - run: ./packages/platform/tools/test-haxe-bindings.sh

  shaders:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build the pinned GLSL validator
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          revision=1062752a891c95b2bfeed9e356562d88f9df84ac
          mkdir -p "$RUNNER_TEMP/glslang"
          archive="$RUNNER_TEMP/glslang.tar.gz"
          curl -fsSL "https://codeload.github.com/KhronosGroup/glslang/tar.gz/$revision" -o "$archive"
          echo "46a05bba7675a3ab1912a0908183b9eee8daa06bb8047943bac54a6f0de2cfce  $archive" | sha256sum --check
          tar xzf "$archive" -C "$RUNNER_TEMP/glslang" --strip-components=1
          cmake -S "$RUNNER_TEMP/glslang" -B "$RUNNER_TEMP/glslang-build" -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_OPT=OFF -DGLSLANG_TESTS=OFF
          cmake --build "$RUNNER_TEMP/glslang-build" --target glslang-standalone --parallel 2
          ln -s "$RUNNER_TEMP/glslang-build/StandAlone/glslang" "$RUNNER_TEMP/glslangValidator"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          echo "NATIVEKIT_GLSLANG_SHA256=$(sha256sum "$RUNNER_TEMP/glslangValidator" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - run: ./packages/ui/tools/check-shaders.sh --validator glslangValidator
      - run: ctest --test-dir out/nativekit-shaders --output-on-failure

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install UI build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libffi-dev libfontconfig1-dev libgl1-mesa-dev libgles2-mesa-dev
          libgtk-3-dev libwebkit2gtk-4.1-dev ninja-build python3-fonttools ripgrep xvfb
      - run: ./scripts/bootstrap-tools.sh
      - name: Configure the UI native runtime
        run: >-
          cmake -S packages/ui -B out/packages/ui/native -GNinja
          -DCMAKE_BUILD_TYPE=Debug -DNK_BUILD_SHARED=ON
          -DNK_BUILD_TESTS=OFF -DNK_BUILD_EXAMPLES=OFF
      - name: Run managed UI framework coverage
        run: ./packages/ui/tools/test-haxeon-framework.sh
      - name: Test project shader generation
        run: ./packages/gpu/tools/test-shader-build.sh
      - name: Run the GPU examples
        run: ./packages/gpu/tools/test-examples.sh
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: '148.0.7778.97'
          install-dependencies: true
      - name: Set up Emscripten
        run: ./vendor/nativekit/tools/setup-web.sh
      - name: Build the Web UI showcase
        env:
          NKUI_HAXEON_SUBSET_FONTS: 'ON'
        run: ./packages/ui/tools/build-web.sh
      - name: Run the Web UI visual suite
        id: web-visual
        env:
          NK_WEB_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: ./packages/ui/tools/test-web-visual.sh
      - name: Upload Web UI visual diffs
        if: failure() && steps.web-visual.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: nativekit-ui-web-visual-diffs
          path: packages/ui/build-web/visual-diffs/*.png

  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install audio build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libffi-dev libfontconfig1-dev libgl1-mesa-dev libgles2-mesa-dev
          libgtk-3-dev libwebkit2gtk-4.1-dev ninja-build
      - run: ./scripts/bootstrap-tools.sh
      - run: ./packages/audio/tools/test-haxeon.sh
