# Temporary: finds where the seed compiler crashes on Windows (status 0xC0000409, no output) during the self-hosting
# bootstrap. hl.exe turns Windows Error Reporting off (SEM_NOGPFAULTERRORBOX), so no crash dump is written; this reruns the
# command that failed under cdb and prints the exception and the stack. Remove once the crash is fixed.
name: Windows crash probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-2022  # as the CI job; on windows-latest (2025, MSVC 14.52) the bootstrap converges
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-host

      # As the CI job runs it: PowerShell, TEST_JOBS=4, output not piped.
      - name: Bootstrap as CI runs it
        id: bootstrap
        continue-on-error: true
        shell: pwsh
        env:
          TEST_JOBS: 4
        run: ./.tools/haxe/haxe.exe --cwd . common.hxml --run build.HaxeonBuild bootstrap

      # The seed compiling stage 1, the command that crashes, three times under cdb: the first exception stops it.
      - name: Stage 1 under cdb
        shell: bash
        env:
          TEST_JOBS: 4
        run: |
          echo "bootstrap: ${{ steps.bootstrap.outcome }}"
          cdb="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          for attempt in 1 2 3; do
            echo "== attempt $attempt"
            "$cdb" -lines -c "sxe av; sxe sov; g; .lastevent; .exr -1; r; kn 80; ~*kn 30; q" \
              out/cmake/windows-msvc/hashlink-runtime/hl.exe out/bootstrap/compiler-seed.hl \
              --output=out/bootstrap/probe-stage-1.hl --build-mode=release --entry=compiler.tools.HaxeonCompiler \
              --root=src --root=stdlib --sources-file=out/bootstrap/compiler-sources.txt 2>&1 \
              | grep -v "ModLoad\|W1001" | tail -150
          done
