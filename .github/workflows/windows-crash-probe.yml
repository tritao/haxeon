# Temporary: finds where the seed compiler crashes on Windows (status 0xC0000409, no output) during the self-hosting
# bootstrap. hl.exe turns Windows Error Reporting off (SEM_NOGPFAULTERRORBOX), so no crash dump is written; this reruns the
# command that failed under cdb and prints the exception and the stack. Remove once the crash is fixed.
name: Windows crash probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-host

      - name: Bootstrap, and the failed command under cdb
        shell: bash
        run: |
          set +e
          ./.tools/haxe/haxe.exe --cwd . common.hxml --run build.HaxeonBuild bootstrap 2>&1 | tee bootstrap.log
          status=${PIPESTATUS[0]}
          echo "bootstrap exited with $status"
          [ "$status" = 0 ] && exit 0
          failed=$(sed -n 's/^\[\(build-command-[0-9]*\)\] failed:.*/\1/p' bootstrap.log | head -1)
          command=$(grep -F "[$failed] " bootstrap.log | grep -v "failed:" | head -1 | sed "s/^\[$failed\] //")
          echo "rerunning $failed under cdb: $command"
          cdb="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          if [ ! -x "$cdb" ]; then ls "/c/Program Files (x86)/Windows Kits/10/" ; exit 1; fi
          # Break on the first exception of any kind, print it and the stacks, and quit.
          "$cdb" -lines -c "sxe av; sxe sov; g; .lastevent; .exr -1; r; kn 80; ~*kn 30; q" $command 2>&1 | tail -400
          exit 1
