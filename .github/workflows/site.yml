name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-host
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - run: sudo apt-get install -y python3-fonttools
      - run: nice -n 10 npm ci
      # The GPU page quotes a shader module the SDK generates, so the SDK builds first.
      - run: nice -n 10 scripts/build-native.sh
        working-directory: .
      - run: nice -n 10 npm run build:gpu-modules
      - run: nice -n 10 npm run build
      # The live UI Showcase on /ui/: Emscripten and the toolkit's Wasm build, so only here and in the deploy.
      - run: nice -n 10 npm run build:showcase
      - run: nice -n 10 npm run check:commands
      - run: nice -n 10 npm run build:circuit-run
      - run: nice -n 10 npm run check:links
      - run: nice -n 10 node scripts/check-template-web.mjs
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      - run: nice -n 10 npm run check:grammars
      - run: nice -n 10 npm run check:examples
