name: compiler-and-runtime

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential curl unzip nodejs libpcre2-dev libuv1-dev
      - name: Bootstrap pinned tools
        run: scripts/bootstrap-tools.sh
      - name: Compiler, differential, and runtime gates
        run: scripts/test.sh
      - name: Self-hosted compiler gate
        run: scripts/bootstrap-compiler.sh --self
      - name: Hot reload gate
        run: tests/integration/test-hot-reload.sh
