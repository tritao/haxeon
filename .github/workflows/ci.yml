name: compiler-and-runtime

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential curl unzip nodejs gdb libpcre2-dev libuv1-dev
      - name: Bootstrap pinned tools
        run: scripts/bootstrap-tools.sh
      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"
      - name: Set up Chrome for Wasm GC
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Browser Wasm GC smoke gate
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: scripts/test-wasm-gc-chrome.sh
      - name: Wasm backend runtime gates
        run: scripts/test-wasm-backend.sh
      - name: Wasm GC parity gate
        run: scripts/test-wasm-gc-parity.sh
      - name: Set up Wasmtime GC runtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "47.0.0"
      - name: Wasm GC runtime gate
        run: scripts/test-wasm-gc-wasmtime.sh
      - name: Compiler, differential, and runtime gates
        run: scripts/test.sh
      - name: Project CLI smoke test
        run: tests/integration/test-haxeon-cli.sh
      - name: Self-hosted compiler gate
        run: scripts/bootstrap-compiler.sh --self
      - name: Hot reload and GDB metadata gate
        run: tests/integration/test-gdb-hot-reload.sh

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      # The pinned Linux Haxe release is x86-64 and runs through QEMU here;
      # keep compiler fan-out below the emulated runner's CPU capacity.
      TEST_JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify ARM64 runner
        run: test "$(uname -m)" = aarch64
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build curl unzip nodejs gdb qemu-user libc6-amd64-cross libpcre2-dev libuv1-dev
      - name: Bootstrap pinned tools
        run: scripts/bootstrap-tools.sh
      - name: Compiler, differential, and runtime gates
        run: scripts/test.sh
      - name: Project CLI smoke test
        run: tests/integration/test-haxeon-cli.sh
      - name: Self-hosted compiler gate
        run: scripts/bootstrap-compiler.sh --self
      - name: Hot reload and GDB metadata gate
        run: tests/integration/test-gdb-hot-reload.sh

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Bootstrap pinned tools and native runtime
        shell: pwsh
        run: ./scripts/setup.ps1
      - name: Verify self-hosted compiler convergence
        shell: pwsh
        run: ./.tools/haxe/haxe.exe --cwd . -cp src --run build.HaxeonBuild bootstrap
      - name: Run cross-platform core tests
        shell: pwsh
        run: ./.tools/haxe/haxe.exe --cwd . -cp src --run build.HaxeonBuild test 8
      - name: Build with the MSVC Debug CRT
        shell: pwsh
        run: |
          cmake --preset windows-msvc-debug -S .
          cmake --build --preset windows-msvc-debug --parallel
      - name: Run core tests with the MSVC Debug CRT
        shell: pwsh
        run: ./.tools/haxe/haxe.exe --cwd . -cp src --run build.HaxeonBuild test 8
      - name: Project CLI smoke test
        shell: pwsh
        run: ./tests/integration/test-haxeon-cli.ps1

  macos:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: brew install cmake ninja node
      - name: Bootstrap pinned tools and native runtime
        run: ./scripts/bootstrap-tools.sh
      - name: Compiler, differential, and runtime gates
        run: ./scripts/test.sh
      - name: Project CLI smoke test
        run: ./tests/integration/test-haxeon-cli.sh
      - name: Self-hosted compiler gate
        run: ./scripts/bootstrap-compiler.sh --self

  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install build dependencies
        run: brew install cmake ninja node
      - name: Bootstrap pinned tools and native runtime
        run: ./scripts/bootstrap-tools.sh
      - name: Compiler, differential, and runtime gates
        run: ./scripts/test.sh
      - name: Project CLI smoke test
        run: ./tests/integration/test-haxeon-cli.sh
      - name: Self-hosted compiler gate
        run: ./scripts/bootstrap-compiler.sh --self
