name: compiler-and-runtime

on:
  push:
  pull_request:
  # A complete run on main every night, and on demand: pushes cancel the run they supersede, which on a busy main can mean
  # no run finishes on every platform for a whole day.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  # Pushes and pull requests share one group per ref and cancel what they supersede, except on main: pushes there come faster
  # than a run finishes, and a run cancelled by the next push gives no verdict, so failures pile up unseen. Main's runs queue
  # instead. Nightly and manual runs each get a group of their own (the run id) and are never cancelled.
  group: compiler-and-runtime-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || 'push' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

jobs:
  platform:
    name: ${{ matrix.name }}
    strategy:
      # Each platform reports its own result: one failing platform must not hide the others behind cancellations.
      fail-fast: false
      matrix:
        # Each limit leaves room for a slow runner and still stops a hung job: Linux x86 takes 77 to 88 minutes, Apple Silicon
        # 59 to 73, Intel 117 to 134 and Windows about 60, and slow runners pushed each past its limit (90, 90, 150, 60) with
        # every suite passing.
        include:
          - name: test
            platform: test
            os: linux
            runs_on: ubuntu-24.04
            timeout: 120
          - name: linux-arm64
            platform: linux-arm64
            os: linux
            runs_on: ubuntu-24.04-arm
            timeout: 90
            test_jobs: 4
          - name: windows
            platform: windows
            os: windows
            runs_on: windows-2022
            # With room for the project templates step, which builds the app's native packages twice.
            timeout: 120
          - name: macos
            platform: macos
            os: macos
            runs_on: macos-15-intel
            timeout: 180
            test_jobs: 4
          - name: macos-arm64
            platform: macos-arm64
            os: macos
            runs_on: macos-15
            timeout: 120
            test_jobs: 4
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      TEST_JOBS: ${{ matrix.test_jobs }}
      # The perf guard and the edit replay run in compiler-guards.yml, on the changes they guard.
      SKIP_COMPILER_GUARDS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify ARM64 runner
        if: matrix.platform == 'linux-arm64'
        run: test "$(uname -m)" = aarch64

      - name: Verify Apple Silicon runner
        if: matrix.platform == 'macos-arm64'
        run: test "$(uname -m)" = arm64

      - uses: ./.github/actions/setup-host

      - name: Set up Node.js runtime
        if: matrix.platform == 'test'
        uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"

      - name: Set up Chrome for Wasm GC
        if: matrix.platform == 'test'
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Verify self-hosted compiler convergence
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./.tools/haxe/haxe.exe --cwd . common.hxml --run build.HaxeonBuild bootstrap

      # The native GC and JIT helper tests (programs linked with libhl.lib, the static VM core, since e7052822), each alone and
      # with a time limit, while the core step below stalls before its first result on Windows. It does not fail the job.
      - name: Native helper tests (diagnostic)
        if: matrix.platform == 'windows'
        shell: bash
        continue-on-error: true
        timeout-minutes: 25
        run: |
          for test in gc-allocation-paths gc-empty-pages gc-owner-pages jit-inline-allocation jit-boxed-allocation string-map-hash; do
            echo "::group::$test"
            start=$SECONDS
            status=0
            timeout -k 10 300 bash "tests/integration/test-$test.sh" || status=$?
            echo "$test: exit $status after $((SECONDS - start)) s (124: timed out)"
            echo "::endgroup::"
          done
          # The driver prints a batch's results when the batch ends: the runtime suite alone says whether the stall is there.
          start=$SECONDS
          status=0
          timeout -k 10 900 ./.tools/haxe/haxe.exe --cwd . common.hxml --run build.HaxeonBuild test 8 --suite runtime || status=$?
          echo "runtime suite: exit $status after $((SECONDS - start)) s (124: timed out)"

      - name: Run cross-platform core tests
        if: matrix.platform == 'windows'
        shell: pwsh
        # Through the pinned Haxe, as the Debug CRT step below: `haxeon.ps1 dev test-driver` ran silent past the job's hour.
        run: ./.tools/haxe/haxe.exe --cwd . common.hxml --run build.HaxeonBuild test 8

      # Builds go through a compile server on Windows too: a second build of a project reuses the first one's. Without one
      # every build falls back to a one-shot compile and live edits reload instead of patching, which nothing else reports.
      - name: Compile server on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        timeout-minutes: 15
        run: |
          cmake --build out/cmake/windows-msvc --target haxeon-command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:HAXEON_NATIVE_READY = "1"
          # A session directory of the step's own, so a failure can show the workers it started and their logs.
          $env:HAXEON_COMPILER_SESSION_DIR = Join-Path $env:RUNNER_TEMP "compiler-sessions"
          $haxeon = (Resolve-Path ./scripts/haxeon.ps1).Path
          $project = Join-Path $env:RUNNER_TEMP "compile-server"
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          Push-Location $project
          & $haxeon create . --template console
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $haxeon build --verbosity=normal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $workers = Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like "*$env:HAXEON_COMPILER_SESSION_DIR*" } |
            ForEach-Object { "$($_.ProcessId) $($_.CommandLine)" } | Out-String
          $sessions = Get-ChildItem $env:HAXEON_COMPILER_SESSION_DIR -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name) $($_.Length)" } | Out-String
          (Get-Content src/Main.hx -Raw) -replace 'Hello', 'Hello again' | Set-Content src/Main.hx
          $second = & $haxeon build --verbosity=normal 2>&1 | Out-String
          $status = $LASTEXITCODE
          Pop-Location
          Write-Output $second
          if ($status -ne 0) { exit $status }
          if ($second -notmatch 'reusing compiler session') {
            Write-Output "Workers after the first build:`n$workers"
            Write-Output "Session directory after the first build:`n$sessions"
            Get-ChildItem $env:HAXEON_COMPILER_SESSION_DIR -Filter *.json -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Output "== $($_.Name)"; Get-Content $_.FullName }
            Get-ChildItem $env:HAXEON_COMPILER_SESSION_DIR -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Output "== $($_.Name)"; Get-Content $_.FullName -Tail 40 }
            Write-Error "The second build did not reuse the compile server"
            exit 1
          }

      # The haxeon path on Windows (the launcher's build check, haxeon.exe, the tool cache, the driver), on two tests and with
      # every stage's output shown as it happens, until it can run the step above. It does not fail the job.
      - name: Test driver through haxeon (diagnostic)
        if: matrix.platform == 'windows'
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 15
        run: |
          cmake --build out/cmake/windows-msvc --target haxeon-command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:HAXEON_NATIVE_READY = "1"
          $env:HL_STDOUT_FLUSH = "1"
          ./scripts/haxeon.ps1 dev test-driver 8 --suite compiler --test ParserRecovery

      - name: Build with the MSVC Debug CRT
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cmake --preset windows-msvc-debug -S .
          cmake --build --preset windows-msvc-debug --parallel

      - name: Run core tests with the MSVC Debug CRT
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./.tools/haxe/haxe.exe --cwd . common.hxml --run build.HaxeonBuild test 8

      - name: C++ CMake FFI integration
        if: matrix.platform == 'windows'
        shell: bash
        env:
          HAXEON_HAXE: ./.tools/haxe/haxe.exe
        run: bash tests/integration/test-cxx-project-ffi-cmake.sh

      - name: Browser Wasm GC smoke gate
        if: matrix.platform == 'test'
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: tests/wasm/test-wasm-gc-chrome.sh

      - name: Wasm backend runtime gates
        if: matrix.platform == 'test'
        run: tests/wasm/test-wasm-backend.sh

      - name: Set up Wasmtime GC runtime
        if: matrix.platform == 'test'
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "47.0.0"

      - name: Wasm GC runtime gate
        if: matrix.platform == 'test'
        run: tests/wasm/test-wasm-gc-wasmtime.sh

      - name: Compiler, differential, and runtime gates
        if: matrix.platform != 'windows'
        run: scripts/test.sh

      - name: Project CLI smoke test
        if: matrix.platform != 'windows'
        run: ./tests/integration/test-haxeon-cli.sh

      - name: Project CLI smoke test
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./tests/integration/test-haxeon-cli.ps1

      # The project templates suite, which scripts/test.sh runs on the other platforms: the app through its Windows runner. It
      # needs none of the steps above but the setup, so it reports even when one of them fails.
      - name: Project templates
        if: ${{ !cancelled() && matrix.platform == 'windows' }}
        shell: pwsh
        run: ./scripts/haxeon.ps1 tests/integration/test-project-templates.hx

      # The compiler's sources build themselves to a fixed point. Whether the checked-in bootstrap/compiler.hl is still that
      # fixed point (bootstrap-compiler.sh --self) is not gated: it holds only until the next compiler change, and refreshing
      # it (bootstrap-compiler.sh) is a step of its own.
      - name: Hot reload and GDB metadata gate
        if: matrix.platform == 'test' || matrix.platform == 'linux-arm64'
        run: ./tests/integration/test-gdb-hot-reload.sh

  android-app:
    name: Android app on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_API_LEVEL: '36'
      ANDROID_IMAGE_TARGET: google_apis
      ANDROID_IMAGE_ARCH: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the pinned Android toolchain
        id: android-toolchain
        run: |
          cmake -P cmake/haxeon-android-toolchain.cmake
          echo "image-path=$ANDROID_HOME/system-images/android-$ANDROID_API_LEVEL/$ANDROID_IMAGE_TARGET/$ANDROID_IMAGE_ARCH" >> "$GITHUB_OUTPUT"

      # The native build in setup-host includes the Android host library once the pinned toolchain is in place.
      - uses: ./.github/actions/setup-host

      - name: Build and stage the Haxeon SDK
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=4 scripts/build-native.sh
          test -s out/sdk/platforms/android/haxeon-host.aar
          echo "HAXEON_NATIVE_READY=1" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm

      - name: Cache the Android system image
        uses: actions/cache@v4
        with:
          path: ${{ steps.android-toolchain.outputs.image-path }}
          key: android-image-${{ runner.os }}-${{ env.ANDROID_API_LEVEL }}-${{ env.ANDROID_IMAGE_TARGET }}-${{ env.ANDROID_IMAGE_ARCH }}

      - name: Check Android launch, patch and reload
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_IMAGE_TARGET }}
          arch: ${{ env.ANDROID_IMAGE_ARCH }}
          disable-linux-hw-accel: false
          script: tests/integration/test-android-app.sh
