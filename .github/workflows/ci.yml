name: compiler-and-runtime

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential curl unzip nodejs gdb libpcre2-dev libuv1-dev
      - name: Bootstrap pinned tools
        run: scripts/bootstrap-tools.sh
      - name: Compiler, differential, and runtime gates
        run: scripts/test.sh
      - name: Self-hosted compiler gate
        run: scripts/bootstrap-compiler.sh --self
      - name: Hot reload and GDB metadata gate
        run: tests/integration/test-gdb-hot-reload.sh

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Bootstrap pinned tools and native runtime
        shell: pwsh
        run: ./scripts/setup.ps1
      - name: Verify self-hosted compiler convergence
        shell: pwsh
        run: ./.tools/haxe/haxe.exe --cwd . -cp src --run build.HaxeonBuild bootstrap
      - name: Run cross-platform core tests
        shell: pwsh
        run: ./.tools/haxe/haxe.exe --cwd . -cp src --run build.HaxeonBuild test 8

  macos:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: brew install cmake ninja node
      - name: Bootstrap pinned tools and native runtime
        run: ./scripts/bootstrap-tools.sh
      - name: Compiler, differential, and runtime gates
        run: ./scripts/test.sh
      - name: Self-hosted compiler gate
        run: ./scripts/bootstrap-compiler.sh --self
