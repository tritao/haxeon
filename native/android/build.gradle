plugins {
    id 'com.android.library' version '9.3.0'
}

def versions = new Properties()
file('versions.txt').withInputStream { versions.load(it) }

android {
    namespace 'org.haxeon.android'
    compileSdk 36
    ndkVersion versions.getProperty('ndk')

    defaultConfig {
        minSdk 28
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    sourceSets.main {
        manifest.srcFile 'AndroidManifest.xml'
        java.srcDirs = ['java']
    }

    externalNativeBuild.cmake {
        path file('cpp/CMakeLists.txt')
        version versions.getProperty('cmake')
    }
}
