plugins {
    id 'com.android.application'
}

def inputFile = file(providers.gradleProperty('haxeonInputs')
    .getOrElse('../../build/generated/android/inputs.properties'))
if (!inputFile.isFile()) {
    throw new GradleException('Prepare this project with haxeon build --target android --gradle-inputs build/generated/android/inputs.properties')
}
def inputs = new Properties()
inputFile.withReader('UTF-8') { inputs.load(it) }
def host = file(inputs.getProperty('host'))
def versions = new Properties()
new File(host.parentFile, 'versions.txt').withInputStream { versions.load(it) }

android {
    namespace inputs.getProperty('id')
    compileSdk Integer.parseInt(versions.getProperty('platform'))

    defaultConfig {
        applicationId inputs.getProperty('id')
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName inputs.getProperty('version')
        manifestPlaceholders = [appLabel: inputs.getProperty('name')]
    }

    sourceSets.main.assets.srcDir inputs.getProperty('assets')

    if (inputs.getProperty('native') == 'true') {
        ndkVersion versions.getProperty('ndk')
        defaultConfig {
            ndk.abiFilters 'arm64-v8a', 'x86_64'
            externalNativeBuild.cmake.arguments "-DHAXEON_GENERATED_DIR=${inputs.getProperty('generated')}"
        }
        externalNativeBuild.cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version versions.getProperty('cmake')
        }
    }
}

dependencies {
    implementation files(host)
}
