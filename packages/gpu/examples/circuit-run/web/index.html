<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circuit Run</title>
<style>
    html, body { margin: 0; }
    canvas { display: block; width: 100%; height: 100dvh; outline: none; }
    #status { position: absolute; inset: 0 auto auto 0; margin: 12px; }
</style>
<canvas id="canvas" tabindex="0" aria-label="Circuit Run"></canvas>
<p id="status" role="status">Loading…</p>
<script src="haxeon-host.js"></script>
<script type="module">
    import { module } from "./haxeon-build.js";
    const canvas = document.querySelector("#canvas");
    const status = document.querySelector("#status");
    // A page that embeds the game, such as the website, waits for these before revealing it.
    const notifyParent = state => {
        if (parent !== window) parent.postMessage("haxeon-circuit-run-" + state, location.origin);
    };
    const fail = error => {
        status.hidden = false;
        status.textContent = error.message;
        notifyParent("failed");
    };
    HaxeonWasmHost.mountApp(module, canvas, {
        onPresented() { status.hidden = true; canvas.focus(); notifyParent("ready"); },
        onStopped() { status.hidden = false; status.textContent = "Circuit Run closed"; },
        onError: fail
    }).catch(fail);
</script>
</html>
